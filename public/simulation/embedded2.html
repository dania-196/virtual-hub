<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Hub | IoT & Embedded Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap');

:root {
  --bg: #07080f;
  --panel: #0d1117;
  --card: #161b22;
  --border: #21262d;
  --accent: #ff69b4;
  --accent-glow: rgba(255,105,180,0.2);
  --green: #22c55e;
  --red: #ef4444;
  --text: #e6edf3;
  --text-dim: #7d8590;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
.main { min-height: 0; }

/* Header */
.header { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 12px; }
.logo { font-weight: 700; color: var(--accent); font-size: 16px; display: flex; align-items: center; gap: 8px; }
.controls { margin-right: auto; display: flex; gap: 8px; }
.btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: .2s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.run { background: var(--green); color: #000; font-weight: 700; border-color: var(--green); }
.btn.stop { background: var(--red); color: #fff; font-weight: 700; border-color: var(--red); }
.btn.home { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-weight: 600; }
.btn.home:hover { background: var(--accent); color: #0a0015; box-shadow: 0 0 14px var(--accent-glow); }

/* Toolstrip */
.toolstrip { height: 38px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 16px; gap: 10px; font-size: 12px; }
.color-dot { width: 16px; height: 16px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .15s ease, border-color .15s ease; }
.color-dot:hover { transform: scale(1.12); }
.color-dot.active { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 8px rgba(255,255,255,.35); }

/* Layout */
.main { flex: 1; display: grid; grid-template-columns: 220px 1fr 360px; min-height: 0; }

/* Sidebar */
.sidebar { background: var(--panel); border-left: 1px solid var(--border); padding: 12px; overflow-y: auto; }
.stitle { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 6px; text-align: center; cursor: grab; user-select: none; font-size: 12px; }
.item:hover { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

/* Canvas */
.canvas { position: relative; background: #05070c; overflow: hidden; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
.svg-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.wire-path { pointer-events: stroke; cursor: pointer; stroke-linecap: round; }
.wire-path:hover { stroke-width: 6px; }

/* Component Nodes */
.node { position: absolute; user-select: none; z-index: 10; }
.pin {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: transparent;
  border: none;
  cursor: pointer;
  display: inline-block;
  z-index: 12;
  transition: 0.15s;
  position: relative;
}
.pin:hover {
  background: rgba(255, 105, 180, 0.55) !important;
  box-shadow: 0 0 8px var(--accent);
}

/* تولتيب مخصص بدل تولتيب المتصفح الافتراضي — بيقرأ نفس نص title تلقائياً */
.pin[title]:hover::after {
  content: attr(title);
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: #161b22;
  color: #fff;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,.5), 0 0 10px var(--accent-glow);
  z-index: 50;
  pointer-events: none;
  animation: pinTooltipIn .12s ease-out;
}
.pin[title]:hover::before {
  content: '';
  position: absolute;
  bottom: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: var(--accent);
  z-index: 50;
  pointer-events: none;
}
@keyframes pinTooltipIn {
  from { opacity: 0; transform: translateX(-50%) translateY(3px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Code Editor & Serial Panel (Fixed LTR) */
.panel-right { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.tabs { display: flex; border-bottom: 1px solid var(--border); }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 12px; cursor: pointer; color: var(--text-dim); }
.tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: var(--card); }
.code-editor { flex: 1; background: #030407; color: #a5d6ff; font-family: 'Fira Code', monospace; font-size: 12px; padding: 12px; border: none; outline: none; resize: none; line-height: 1.5; dir: ltr; text-align: left; }
.console { flex: 1; background: #020305; padding: 12px; font-family: 'Fira Code', monospace; font-size: 11px; overflow-y: auto; dir: ltr; text-align: left; color: #4ade80; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚡ Virtual Hub - IoT Simulator</div>
  <div class="controls">
    <button class="btn home" onclick="goToDashboard()">🏠 الرئيسية</button>
    <button class="btn" onclick="setMode('select')">🖱 اختيار وتحريك</button>
    <button class="btn" onclick="setMode('wire')">🔌 توصيل سلك</button>
    <button class="btn run" onclick="runSimulation()">▶ تشغيل المحاكاة</button>
    <button class="btn stop" onclick="stopSimulation()">■ إيقاف</button>
  </div>
</div>

<div class="toolstrip">
  <span>لون السلك:</span>
  <div class="color-dot active" style="background:#ef4444" onclick="setWireColor('#ef4444', this)" title="أحمر"></div>
  <div class="color-dot" style="background:#3b82f6" onclick="setWireColor('#3b82f6', this)" title="أزرق"></div>
  <div class="color-dot" style="background:#22c55e" onclick="setWireColor('#22c55e', this)" title="أخضر"></div>
  <div class="color-dot" style="background:#f59e0b" onclick="setWireColor('#f59e0b', this)" title="برتقالي"></div>
  <div class="color-dot" style="background:#333333" onclick="setWireColor('#333333', this)" title="أسود"></div>
  <span id="statusLabel" style="margin-right:auto; color:var(--text-dim)">الوضع: اختيار وتحريك</span>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="stitle">المتحكمات واللوحات</div>
    <div class="grid">
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'arduino')">🟦 Arduino Uno</div>
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'breadboard')">🟩 Breadboard</div>
    </div>
    <div class="stitle">الحساسات والمخرجات</div>
    <div class="grid">
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'ultrasonic')">📡 Ultrasonic</div>
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'pot')">🎛 Potentiometer</div>
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'led')">🔴 Red LED</div>
      <div class="item" draggable="true" ondragstart="onDragStart(event, 'buzzer')">🔊 Buzzer</div>
    </div>
  </div>

  <!-- Canvas Surface -->
  <div class="canvas" id="canvas" ondragover="event.preventDefault()" ondrop="onDrop(event)">
    <svg class="svg-layer" id="svgLayer"></svg>
    <div id="surface"></div>
  </div>

  <!-- Right Code/Serial Panel -->
  <div class="panel-right">
    <div class="tabs">
      <div class="tab active" onclick="showTab('code')">كود أردوينو (C++)</div>
      <div class="tab" onclick="showTab('serial')">الشاشة التسلسلية (Serial)</div>
    </div>
    <textarea id="codeArea" class="code-editor" spellcheck="false" dir="ltr">
void setup() {
  pinMode(9, OUTPUT);
  pinMode(8, OUTPUT);
  Serial.begin(9600);
}

void loop() {
  int potValue = analogRead(A0);
  int dist = getUltrasonicDistance();

  Serial.print("Potentiometer: ");
  Serial.print(potValue);
  Serial.print(" | Distance: ");
  Serial.println(dist);

  if (dist < 30 || potValue > 500) {
    digitalWrite(9, HIGH); // LED ON
    digitalWrite(8, HIGH); // Buzzer ON
  } else {
    digitalWrite(9, LOW);  // LED OFF
    digitalWrite(8, LOW);  // Buzzer OFF
  }
  delay(500);
}
    </textarea>
    <div id="serialConsole" class="console" style="display:none;" dir="ltr">
      [System] Serial Monitor Initialized...<br>
    </div>
  </div>
</div>

<script>
let mode = 'select';
let currentColor = '#ef4444';
let comps = [], wires = [];
let activeWireStart = null;
let simInterval = null;
let audioCtx = null;

// زر الرجوع للداشبورد (dashboard2.html بنفس مستوى مجلد public، وهاد الملف جوا public/simulation)
function goToDashboard() {
  location.href = '../dashboard2.html';
}

function setMode(m) {
  mode = m;
  document.getElementById('statusLabel').innerText = 'الوضع: ' + (m === 'select' ? 'اختيار وتحريك' : 'توصيل أسلاك');
}

function setWireColor(c, el) {
  currentColor = c;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
}

function onDragStart(e, type) { e.dataTransfer.setData('type', type); }

function onDrop(e) {
  e.preventDefault();
  const type = e.dataTransfer.getData('type');
  const rect = document.getElementById('canvas').getBoundingClientRect();
  const x = e.clientX - rect.left - 50;
  const y = e.clientY - rect.top - 30;
  createComponent(type, x, y);
}

function createComponent(type, x, y) {
  const id = 'comp_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const comp = { id, type, x, y, state: { val: 0, dist: 50 } };

  const el = document.createElement('div');
  el.className = 'node';
  el.id = id;
  el.style.left = x + 'px';
  el.style.top = y + 'px';

  if (type === 'arduino') {
    el.innerHTML = `
      <div style="position: relative; width: 280px; height: 200px;">
        <img src="ArduinoUno.svg.webp" style="width: 100%; height: 100%; pointer-events: none; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">

        <!-- Digital Pins -->
        <div class="pin" data-cid="${id}" data-pin="D13" style="position: absolute; top: 7px; left: 119px;" title="D13"></div>
        <div class="pin" data-cid="${id}" data-pin="D12" style="position: absolute; top: 7px; left: 130px;" title="D12"></div>
        <div class="pin" data-cid="${id}" data-pin="D11" style="position: absolute; top: 7px; left: 141px;" title="D11"></div>
        <div class="pin" data-cid="${id}" data-pin="D10" style="position: absolute; top: 7px; left: 152px;" title="D10"></div>
        <div class="pin" data-cid="${id}" data-pin="D9"  style="position: absolute; top: 7px; left: 163px;" title="D9"></div>
        <div class="pin" data-cid="${id}" data-pin="D8"  style="position: absolute; top: 7px; left: 174px;" title="D8"></div>
        <div class="pin" data-cid="${id}" data-pin="D7"  style="position: absolute; top: 7px; left: 192px;" title="D7"></div>
        <div class="pin" data-cid="${id}" data-pin="D6"  style="position: absolute; top: 7px; left: 203px;" title="D6"></div>
        <div class="pin" data-cid="${id}" data-pin="D5"  style="position: absolute; top: 7px; left: 214px;" title="D5"></div>
        <div class="pin" data-cid="${id}" data-pin="D4"  style="position: absolute; top: 7px; left: 225px;" title="D4"></div>
        <div class="pin" data-cid="${id}" data-pin="D3"  style="position: absolute; top: 7px; left: 236px;" title="D3"></div>
        <div class="pin" data-cid="${id}" data-pin="D2"  style="position: absolute; top: 7px; left: 247px;" title="D2"></div>

        <!-- Power Pins -->
        <div class="pin" data-cid="${id}" data-pin="5V"  style="position: absolute; bottom: 7px; left: 163px;" title="5V"></div>
        <div class="pin" data-cid="${id}" data-pin="GND" style="position: absolute; bottom: 7px; left: 174px;" title="GND"></div>
        <div class="pin" data-cid="${id}" data-pin="GND" style="position: absolute; bottom: 7px; left: 185px;" title="GND"></div>

        <!-- Analog Pins -->
        <div class="pin" data-cid="${id}" data-pin="A0"  style="position: absolute; bottom: 7px; left: 206px;" title="A0"></div>
        <div class="pin" data-cid="${id}" data-pin="A1"  style="position: absolute; bottom: 7px; left: 217px;" title="A1"></div>
        <div class="pin" data-cid="${id}" data-pin="A2"  style="position: absolute; bottom: 7px; left: 228px;" title="A2"></div>
        <div class="pin" data-cid="${id}" data-pin="A3"  style="position: absolute; bottom: 7px; left: 239px;" title="A3"></div>
        <div class="pin" data-cid="${id}" data-pin="A4"  style="position: absolute; bottom: 7px; left: 250px;" title="A4"></div>
        <div class="pin" data-cid="${id}" data-pin="A5"  style="position: absolute; bottom: 7px; left: 261px;" title="A5"></div>
      </div>`;
  } else if (type === 'breadboard') {
    // إحداثيات محسوبة فعلياً من تحليل بكسلات breadboard.png (188×299) — نسب مئوية عشان تضل صحيحة أياً كان حجم العرض
    const colXL = [22.87, 27.13, 31.91, 36.70, 41.49]; // a b c d e
    const colXR = [55.85, 60.64, 65.43, 70.21, 75.00]; // f g h i j
    const colNamesL = ['a', 'b', 'c', 'd', 'e'];
    const colNamesR = ['f', 'g', 'h', 'i', 'j'];
    const railLpwrX = 8.51, railLgndX = 13.83, railRpwrX = 85.64, railRgndX = 91.49;

    const rowYMain = [7.02,10.03,13.04,16.05,19.06,22.07,25.08,28.09,31.10,33.78,36.79,39.80,42.81,45.82,48.83,51.84,54.85,57.86,60.87,63.88,66.89,69.90,72.91,75.92,78.60,81.94,84.62,87.96,90.97,93.65];
    const rowYRail = [7.02,10.03,13.04,16.05,19.06, 25.08,28.09,31.10,33.78,36.79, 42.81,45.82,48.83,51.84,54.85, 62.54,65.55,68.56,71.57,74.58, 81.61,84.62,87.63,90.64,93.65];

    let holesHTML = '';
    rowYMain.forEach((top, i) => {
      const r = i + 1;
      colXL.forEach((x, j) => { holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_L_${colNamesL[j]}_${r}" style="position:absolute; top:${top}%; left:${x}%;" title="${colNamesL[j]}${r}"></div>`; });
      colXR.forEach((x, j) => { holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_R_${colNamesR[j]}_${r}" style="position:absolute; top:${top}%; left:${x}%;" title="${colNamesR[j]}${r}"></div>`; });
    });
    rowYRail.forEach((top, i) => {
      const r = i + 1;
      holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_LPWR_${r}" style="position:absolute; top:${top}%; left:${railLpwrX}%;" title="+ (Left)"></div>`;
      holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_LGND_${r}" style="position:absolute; top:${top}%; left:${railLgndX}%;" title="- (Left)"></div>`;
      holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_RPWR_${r}" style="position:absolute; top:${top}%; left:${railRpwrX}%;" title="+ (Right)"></div>`;
      holesHTML += `<div class="pin" data-cid="${id}" data-pin="BB_RGND_${r}" style="position:absolute; top:${top}%; left:${railRgndX}%;" title="- (Right)"></div>`;
    });

    el.innerHTML = `
      <div style="position: relative; width: 220px; aspect-ratio: 188 / 299;">
        <img src="breadboard.png" style="width: 100%; height: 100%; pointer-events: none; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));">
        ${holesHTML}
      </div>`;
  } else if (type === 'ultrasonic') {
    // إحداثيات محسوبة من تحليل بكسلات ultrasonic.png (344×186)
    el.innerHTML = `
      <div style="position: relative; width: 180px; background: transparent; border-radius: 8px; padding: 6px 6px 18px;">
        <div style="position: relative; width: 100%; aspect-ratio: 344 / 186;">
          <img src="ultrasonic.png" style="width: 100%; height: 100%; pointer-events: none; display: block;">
          <div class="pin" data-cid="${id}" data-pin="VCC"  style="position: absolute; top: 98%; left: 41.86%;" title="VCC (+5V)"></div>
          <div class="pin" data-cid="${id}" data-pin="TRIG" style="position: absolute; top: 98%; left: 47.09%;" title="TRIG"></div>
          <div class="pin" data-cid="${id}" data-pin="ECHO" style="position: absolute; top: 98%; left: 52.33%;" title="ECHO"></div>
          <div class="pin" data-cid="${id}" data-pin="GND"  style="position: absolute; top: 98%; left: 57.85%;" title="GND"></div>
        </div>
        <div style="margin-top: 10px; text-align: center;">
          <input type="range" min="2" max="200" value="50" style="width: 120px; cursor: pointer;" oninput="updateCompState('${id}', 'dist', this.value); this.nextElementSibling.innerText=this.value+' cm'">
          <span style="font-size: 11px; color: #38bdf8; font-weight: bold; margin-left: 4px;">50 cm</span>
        </div>
      </div>`;
  } else if (type === 'pot') {
    el.innerHTML = `
      <div style="position: relative; width: 130px; height: 160px; background: transparent; border-radius: 8px; padding: 6px;">
        <div style="position: relative; width: 110px; height: 110px; margin: 0 auto;">
          <img src="potentiometer.png" style="width: 100%; height: 100%; pointer-events: none; display: block;">
          <div class="pin" data-cid="${id}" data-pin="GND" style="position: absolute; bottom: 8px; left: 32px;" title="GND"></div>
          <div class="pin" data-cid="${id}" data-pin="VCC" style="position: absolute; bottom: 8px; left: 49px;" title="VCC (+5V)"></div>
          <div class="pin" data-cid="${id}" data-pin="SIG" style="position: absolute; bottom: 8px; left: 66px;" title="SIG (Signal)"></div>
        </div>
        <div style="margin-top: 6px; text-align: center;">
          <input type="range" min="0" max="1023" value="0" style="width: 90px; cursor: pointer;" oninput="updateCompState('${id}', 'val', this.value); this.nextElementSibling.innerText=this.value">
          <span style="font-size: 11px; color: #38bdf8; font-weight: bold; margin-left: 4px;">0</span>
        </div>
      </div>`;
  } else if (type === 'led') {
    // إحداثيات محسوبة من تحليل بكسلات led.png (216×876) — الكاثود أقصر ("32.87%,86.3%") والأنود أطول ("58.33%,99%")
    el.innerHTML = `
      <div style="position: relative; width: 50px; aspect-ratio: 216 / 876; text-align: center; background: transparent; margin: 0 auto;">
        <div id="glow_${id}" style="position: absolute; top: 4%; left: 22%; width: 55%; height: 8%; border-radius: 50%; background: rgba(239, 68, 68, 0); transition: 0.3s; filter: blur(6px);"></div>
        <img src="led.png" style="width: 100%; height: 100%; pointer-events: none; display: block; position: relative; z-index: 2;">
        <div class="pin" data-cid="${id}" data-pin="CATHODE" style="position: absolute; top: 86.3%; left: 32.87%;" title="- (Cathode / Short Pin)"></div>
        <div class="pin" data-cid="${id}" data-pin="ANODE"   style="position: absolute; top: 99%;   left: 58.33%;" title="+ (Anode / Long Pin)"></div>
      </div>`;
  } else if (type === 'buzzer') {
    el.innerHTML = `
      <div style="position: relative; width: 120px; height: 140px; text-align: center; background: transparent;">
        <div style="position: relative; width: 100px; height: 120px; margin: 0 auto;">
          <img src="buzzer.png" style="width: 100%; height: 100%; pointer-events: none; display: block;">
          <div class="pin" data-cid="${id}" data-pin="NEG" style="position: absolute; bottom: 5px; left: 42px;" title="- (GND)"></div>
          <div class="pin" data-cid="${id}" data-pin="POS" style="position: absolute; bottom: 5px; left: 51px;" title="+ (VCC / Signal)"></div>
        </div>
      </div>`;
  }

  document.getElementById('surface').appendChild(el);
  comps.push(comp);
  makeDraggable(el, comp);
  bindPinEvents(el);
}

function updateCompState(id, key, val) {
  const c = comps.find(x => x.id === id);
  if (c) c.state[key] = parseInt(val);
}

function makeDraggable(el, comp) {
  let isDragging = false, offX = 0, offY = 0;
  el.addEventListener('mousedown', e => {
    if (mode !== 'select' || e.target.classList.contains('pin') || e.target.tagName === 'INPUT') return;
    isDragging = true;
    offX = e.clientX - comp.x;
    offY = e.clientY - comp.y;
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    comp.x = e.clientX - offX;
    comp.y = e.clientY - offY;
    el.style.left = comp.x + 'px';
    el.style.top = comp.y + 'px';
    renderWires();
  });
  document.addEventListener('mouseup', () => isDragging = false);
}

function bindPinEvents(el) {
  el.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('click', e => {
      e.stopPropagation();
      if (mode !== 'wire') return;

      const cid = pin.dataset.cid;
      const pname = pin.dataset.pin;

      if (!activeWireStart) {
        activeWireStart = { cid, pname, el: pin };
        pin.style.outline = '2px solid yellow';
      } else {
        if (activeWireStart.cid !== cid) {
          wires.push({
            id: 'wire_' + Date.now(),
            from: activeWireStart,
            to: { cid, pname, el: pin },
            color: currentColor
          });
        }
        activeWireStart.el.style.outline = 'none';
        activeWireStart = null;
        renderWires();
      }
    });
  });
}

function renderWires() {
  const svg = document.getElementById('svgLayer');
  svg.innerHTML = '';
  const canvasRect = document.getElementById('canvas').getBoundingClientRect();

  wires.forEach(w => {
    const r1 = w.from.el.getBoundingClientRect();
    const r2 = w.to.el.getBoundingClientRect();
    const x1 = r1.left + r1.width / 2 - canvasRect.left;
    const y1 = r1.top + r1.height / 2 - canvasRect.top;
    const x2 = r2.left + r2.width / 2 - canvasRect.left;
    const y2 = r2.top + r2.height / 2 - canvasRect.top;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${(y1 + y2) / 2}, ${x2} ${(y1 + y2) / 2}, ${x2} ${y2}`);
    path.setAttribute('stroke', w.color);
    path.setAttribute('stroke-width', '3.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('class', 'wire-path');
    path.onclick = () => { if (confirm('حذف هذا السلك؟')) { wires = wires.filter(x => x.id !== w.id); renderWires(); } };
    svg.appendChild(path);
  });
}

function getConnectedComponentPin(ardPin) {
  const wire = wires.find(w => (w.from.pname === ardPin) || (w.to.pname === ardPin));
  if (!wire) return null;
  return (wire.from.pname === ardPin) ? wire.to : wire.from;
}

function runSimulation() {
  stopSimulation();
  showTab('serial');
  const consoleEl = document.getElementById('serialConsole');
  consoleEl.innerHTML = `<span style="color:#60a5fa">[System] Engine Running...</span><br>`;

  simInterval = setInterval(() => {
    let potVal = 0;
    const a0Conn = getConnectedComponentPin('A0');
    if (a0Conn) {
      const potComp = comps.find(c => c.id === a0Conn.cid && c.type === 'pot');
      if (potComp) potVal = potComp.state.val;
    }

    let distVal = 50;
    const ultraComp = comps.find(c => c.type === 'ultrasonic');
    if (ultraComp) distVal = ultraComp.state.dist;

    consoleEl.innerHTML += `Potentiometer (A0): ${potVal} | Distance (HC-SR04): ${distVal}cm<br>`;
    consoleEl.scrollTop = consoleEl.scrollHeight;

    const shouldTrigger = (distVal < 30 || potVal > 500);

    const d9Conn = getConnectedComponentPin('D9');
    if (d9Conn) {
      const ledGlow = document.getElementById('glow_' + d9Conn.cid);
      if (ledGlow) {
        ledGlow.style.background = shouldTrigger ? 'rgba(239, 68, 68, 0.85)' : 'rgba(239, 68, 68, 0)';
        ledGlow.style.boxShadow = shouldTrigger ? '0 0 20px #ef4444' : 'none';
      }
    }

    const d8Conn = getConnectedComponentPin('D8');
    if (d8Conn) {
      const buzComp = comps.find(c => c.id === d8Conn.cid && c.type === 'buzzer');
      if (buzComp && shouldTrigger) triggerBuzzerSound();
    }
  }, 600);
}

function triggerBuzzerSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(440, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.15);
}

function stopSimulation() {
  if (simInterval) clearInterval(simInterval);
  document.querySelectorAll('[id^="glow_"]').forEach(g => {
    g.style.background = 'rgba(239, 68, 68, 0)';
    g.style.boxShadow = 'none';
  });
}

function showTab(t) {
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (i === 0 && t === 'code') || (i === 1 && t === 'serial')));
  document.getElementById('codeArea').style.display = t === 'code' ? 'block' : 'none';
  document.getElementById('serialConsole').style.display = t === 'serial' ? 'block' : 'none';
}

window.onload = () => {
  createComponent('arduino', 30, 40);
  createComponent('breadboard', 320, 40);
  createComponent('ultrasonic', 30, 260);
  createComponent('led', 220, 260);
};
